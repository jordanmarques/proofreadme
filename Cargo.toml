[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jordanmarques/proofreadme"

[workspace.dependencies]
# internal
proofreadme-core = { path = "crates/core" }
proofreadme-icon = { path = "crates/icon" }
kairo = { path = "crates/kairo" }

# interface
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"

# core
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
tiny_http = "0.12"

# application
winit = { version = "0.30", default-features = false }

# tooling (resources of the Windows executable)
winresource = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
debug = "line-tables-only"
