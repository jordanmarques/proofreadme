# Release pipeline: the push of a tag `v<version>` builds the macOS disk image and the Windows
# installer and publishes them, with their checksums, on the GitHub Release of that tag. See
# docs/releasing.md.
#
# A pull request that touches the pipeline, and a manual run, are dry runs: the packages are built
# and kept as workflow artifacts, and nothing is published.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - xtask/**
      - apps/proofreadme/build.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-upload; a newer push waits its turn.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Resolve the workspace version
        run: |
          v="$(awk '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0} s && $1=="version"{gsub(/"/,"",$3);print $3}' Cargo.toml)"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # A tag publishes the version of the commit it points at, and only that one.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the workspace version $v: tag v$v, or bump the version (cargo xtask version set) first"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          echo "ProofReadMe v$v (prerelease: $pre)"

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version of `rust-toolchain.toml`, as in ci.yml.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.95"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
      # ADR 0004: the bundle is signed with the "ProofReadMe Signing" certificate, held in the
      # repository secrets (README, "Signing the CI builds") and imported into a keychain of this
      # run. Without the secrets the bundle is signed ad hoc.
      - name: Import the signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::MACOS_SIGNING_P12 and MACOS_SIGNING_PASSWORD are not set: ProofReadMe.app is signed ad hoc, and the Accessibility permission will not survive updates of this build. See README, \"Signing the CI builds\"."
            echo "flags=--ad-hoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          # Lets codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # The keychain joins the search list, where `cargo xtask package` and codesign look.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "flags=" >> "$GITHUB_OUTPUT"
      - name: Build the universal bundle and its disk image
        run: cargo xtask package --universal --dmg ${{ steps.signing.outputs.flags }}
      - name: Check the bundle
        run: |
          archs="$(lipo -archs dist/ProofReadMe.app/Contents/MacOS/ProofReadMe)"
          echo "architectures: $archs"
          case "$archs" in *arm64*) ;; *) echo "::error::no arm64 slice"; exit 1 ;; esac
          case "$archs" in *x86_64*) ;; *) echo "::error::no x86_64 slice"; exit 1 ;; esac
          codesign --verify --deep --strict --verbose=2 dist/ProofReadMe.app
          codesign --display --verbose=2 dist/ProofReadMe.app
          plutil -lint dist/ProofReadMe.app/Contents/Info.plist
          test "$(plutil -extract LSUIElement raw dist/ProofReadMe.app/Contents/Info.plist)" = "true"
      - name: Check the disk image
        run: |
          hdiutil verify dist/ProofReadMe.dmg
          mount="$(mktemp -d)"
          hdiutil attach dist/ProofReadMe.dmg -nobrowse -readonly -mountpoint "$mount"
          codesign --verify --deep --strict "$mount/ProofReadMe.app"
          test "$(readlink "$mount/Applications")" = "/Applications"
          hdiutil detach "$mount"
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.flags == ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Name the disk image
        run: |
          mkdir -p dist/release
          mv dist/ProofReadMe.dmg "dist/release/proofreadme-${VERSION}-macos-universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the executable and its installer
        run: cargo xtask package --msi
      - name: Check the installer
        shell: pwsh
        run: |
          $installed = "$env:LOCALAPPDATA\Programs\ProofReadMe\ProofReadMe.exe"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ProofReadMe.lnk"
          function Msiexec([string[]] $arguments) {
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { Get-Content msi.log; throw "msiexec $arguments`: exit code $($process.ExitCode)" }
          }
          Msiexec @('/i', 'dist\ProofReadMe.msi', '/qn', '/l*v', 'msi.log')
          if (-not (Test-Path $installed)) { throw "not installed at $installed" }
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash dist\ProofReadMe.exe).Hash) { throw "the installed executable is not the built one" }
          if (-not (Test-Path $shortcut)) { throw "no shortcut in the Start menu" }
          # Installing again stands for an update: the installed version is replaced, not doubled.
          Msiexec @('/i', 'dist\ProofReadMe.msi', '/qn', '/l*v', 'msi.log')
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $products = $installer.GetType().InvokeMember('RelatedProducts', 'GetProperty', $null, $installer, @('{bbaac658-803d-4940-a7e2-9a4c3f298bb8}'))
          if ($products.Count -ne 1) { throw "$($products.Count) installed ProofReadMe products after an update" }
          Msiexec @('/x', 'dist\ProofReadMe.msi', '/qn', '/l*v', 'msi.log')
          if (Test-Path $installed) { throw "still installed after uninstall" }
          if (Test-Path $shortcut) { throw "shortcut left after uninstall" }
      - name: Name the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          Move-Item dist\ProofReadMe.msi "dist\release\proofreadme-$env:VERSION-windows-x64.msi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [version, macos, windows]
    # Only the push of a tag publishes; every other run stops at the artifacts.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum proofreadme-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release, or add the packages to it
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Already published (for instance by hand): the packages are added, replacing any of the same name.
            gh release upload "$TAG" artifacts/* --clobber
          else
            flags=""
            if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
            gh release create "$TAG" $flags --verify-tag --title "ProofReadMe v${VERSION}" --generate-notes artifacts/*
          fi
