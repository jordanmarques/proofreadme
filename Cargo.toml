[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jordanmarques/proofreadme"

[workspace.dependencies]
# internal
proofreadme-core = { path = "crates/core" }
proofreadme-icon = { path = "crates/icon" }
kairo = { path = "crates/kairo" }
proofreadme-os-windows = { path = "crates/os-windows" }

# interface
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"

# core
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
toml = "1"
tiny_http = "0.12"
tempfile = "3"

# application
winit = { version = "0.30", default-features = false }
dirs = "6"
keyring = "4"
# session agent: icon, launch-at-login registration, single instance
tray-icon = "0.26"
auto-launch = "0.6"
interprocess = "2"
# Windows adapters (`crates/os-windows`)
windows-sys = "0.61"
arboard = "3.6"
clipboard-win = "5.4"
png = "0.18"
# notifications of the agent (failures, correction left on the clipboard)
notify-rust = "4"

# tooling (resources of the Windows executable)
winresource = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
debug = "line-tables-only"
