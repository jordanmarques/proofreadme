# The single check of the repository (`cargo xtask ci`: format, clippy, layers, tests), on the two
# targeted systems. The workflow is the only place where both macOS and Windows are compiled and
# tested on every pull request.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version of `rust-toolchain.toml`: the CI runs the clippy of local builds.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo xtask ci
        run: cargo xtask ci

  # `cargo xtask package` on both systems. The runner has no signing certificate: the macOS
  # bundle is signed ad hoc (`--ad-hoc`), after checking that packaging without the certificate
  # stops with its explanation.
  package-macos:
    name: cargo xtask package (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package
      - name: Without the certificate, packaging stops and says how to create it
        run: |
          if cargo xtask package 2> refusal.txt; then echo "::error::packaged without a certificate"; exit 1; fi
          cat refusal.txt
          grep -q 'no code signing certificate named "ProofReadMe Signing"' refusal.txt
      - name: Package, signed ad hoc
        run: cargo xtask package --ad-hoc
      - name: Check the bundle
        run: |
          codesign --verify --deep --strict --verbose=2 dist/ProofReadMe.app
          codesign --display --verbose=2 dist/ProofReadMe.app
          plutil -lint dist/ProofReadMe.app/Contents/Info.plist
          test "$(plutil -extract LSUIElement raw dist/ProofReadMe.app/Contents/Info.plist)" = "true"
          test -x dist/ProofReadMe.app/Contents/MacOS/ProofReadMe
          test -s dist/ProofReadMe.app/Contents/Resources/ProofReadMe.icns

  package-windows:
    name: cargo xtask package (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package
      - name: Package
        run: cargo xtask package
      - name: Check the executable
        shell: pwsh
        run: |
          $exe = 'dist\ProofReadMe.exe'
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName, FileDescription, FileVersion, OriginalFilename
          if ($info.ProductName -ne 'ProofReadMe' -or -not $info.FileVersion) { throw 'no version information' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "subsystem $subsystem: the executable would open a console" }
